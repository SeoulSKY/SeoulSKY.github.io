<svg xmlns="http://www.w3.org/2000/svg" viewBox="22 28 236 279.8" width="944" height="1119">
  <!-- SeoulSKY swallow: construction. Every curve is an arc of a circle whose
       radius is r = 3.5·φⁿ (φ, the golden ratio); the long edges are straight.
       Neighbouring arcs meet tangent to each other. The numbers on the arcs are n. -->
  <style>
