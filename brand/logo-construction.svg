    .t{font:600 6.5px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#ffc3a1;text-anchor:middle;dominant-baseline:middle}
    .h{font:600 3.6px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#f4f0ff;fill-opacity:.45;letter-spacing:.3px;text-transform:uppercase}
    .l{font:4.2px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#a7a3c7}
    .k{font:600 4.2px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#ffc3a1}
    .sup{font-size:2.9px}
    .dim{fill-opacity:.6;font-size:3.6px}
  </style>
